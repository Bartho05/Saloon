<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título e description ficam genéricos de propósito: HTML estático não
         tem acesso ao banco. O SalonProvider troca document.title pelo nome
         configurado assim que a API responde. -->
    <meta name="description" content="Agendamento online" />
    <meta name="theme-color" content="#111111" />
    <title>Agendamento online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Space Grotesk é a fonte `display`, a que carrega a tipografia editorial do
      projeto. Ela estava faltando aqui: o CSS declarava a família, o navegador
      não tinha o arquivo, e tudo caía em system-ui. O efeito é silencioso —
      o `getComputedStyle` continua devolvendo "Space Grotesk", então uma
      inspeção de estilo não denuncia nada, mas o desenho na tela é outro.

      `display=swap` no parâmetro: mostra a fonte de sistema primeiro e troca
      quando a chega. É preferível a um instante de tela vazia.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
